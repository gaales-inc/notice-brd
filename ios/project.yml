# The NoticeBrd app for iPhone and iPad. Generate the Xcode project with
# `xcodegen generate` (in this folder) after changing this file; the
# generated NoticeBrd.xcodeproj is committed, so Xcode alone can open it.
name: NoticeBrd
options:
  bundleIdPrefix: com.gaales
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
targets:
  NoticeBrd:
    type: application
    platform: iOS
    sources:
      - NoticeBrd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaales.noticebrd
        INFOPLIST_FILE: NoticeBrd/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Your team, from Xcode's Signing & Capabilities tab.
        DEVELOPMENT_TEAM: ""
